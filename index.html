<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>DayTrack</h1>

    <main class="cards">
        <div>
            <h2>Gás</h2>
            <p id="UltimaTrocaGas">Última troca: </p>
            <input type="date" id="dataGas">
            <p id="ProximaTrocaGas" class="proxima">Próxima troca: </p>
            <button id="registrarGas">Registrar troca</button>
        </div>


        <div>
            <h2>Escova de dentes</h2>
            <p id="ultimaTrocaEscova">Última troca: </p>
            <input type="date" id="dataEscova">
            <p id="ProximaTrocaEscova" class="proxima">Próxima troca: </p>
            <button id="registrarEscova">Registrar troca</button>
        </div>

        <div>
            <h2>Rémedio de verme</h2>
            <p id="ultimoRemedioVerme">Última vez: </p>
            <input type="date" id="dataRemedioVerme">
            <p id="ProximoRemedioVerme" class="proxima">Próxima vez: </p>
            <button id="registrarRemedioVerme">Registrar</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
